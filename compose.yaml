services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kape
      POSTGRES_PASSWORD: kape_local_only
      POSTGRES_DB: kape_alon
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kape -d kape_alon"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
